<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoWild Rewilding Survey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16241C;
  --canopy:#24402F;
  --canopy-2:#2F4F3A;
  --moss:#6E8F63;
  --moss-light:#B9CBA9;
  --sand:#EFE9D8;
  --sand-2:#E4DCC6;
  --paper:#FAF7EE;
  --clay:#A85A34;
  --clay-dark:#8A4527;
  --horizon:#3E6E7E;
  --horizon-light:#DCE9EA;
  --warn:#B4432F;
  --line:#CFC5A6;
  --shadow: 0 1px 2px rgba(22,36,28,.08), 0 4px 14px rgba(22,36,28,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--sand);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
#root{max-width:900px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.06);}
a{color:var(--horizon);}

/* ===== Top bar / header ===== */
.topbar{
  background:linear-gradient(160deg,var(--canopy) 0%,var(--canopy-2) 100%);
  color:var(--sand);
  padding:22px 28px 18px;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(185,203,169,.18) 0%,transparent 70%);
}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss-light);font-weight:600;}
.topbar h1{font-size:26px;margin:4px 0 2px;font-weight:600;letter-spacing:-.01em;}
.topbar .org{font-size:13px;color:var(--sand-2);opacity:.85;}

/* Succession ladder = main step nav */
.ladder{display:flex;align-items:flex-end;gap:0;margin-top:18px;padding:0 2px;}
.ladder .rung{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;}
.ladder .rung .dot{
  width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.35);margin-bottom:6px;transition:.2s;
}
.ladder .rung.done .dot{background:var(--moss-light);border-color:var(--moss-light);}
.ladder .rung.active .dot{width:18px;height:18px;background:var(--clay);border-color:#fff;}
.ladder .rung .bar{height:3px;width:100%;background:rgba(255,255,255,.18);position:absolute;top:6px;left:-50%;z-index:-1;}
.ladder .rung:first-child .bar{display:none;}
.ladder .rung.done .bar, .ladder .rung.active .bar{background:var(--moss-light);}
.ladder .rung .lbl{font-size:10.5px;color:var(--sand-2);text-align:center;letter-spacing:.02em;}
.ladder .rung.active .lbl{color:#fff;font-weight:600;}

/* ===== Body / content ===== */
.content{padding:26px 28px 100px;}
.card{
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.section-title{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--canopy);}
.section-sub{font-size:13.5px;color:#5b6b5f;margin:0 0 18px;line-height:1.5;}
.helptext{
  background:var(--horizon-light);border-left:3px solid var(--horizon);
  padding:10px 14px;border-radius:0 6px 6px 0;font-size:12.5px;color:#2c4a52;
  margin:10px 0 16px;line-height:1.55;
}
.field{margin-bottom:20px;}
.field label.q{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--ink);}
.field .note{font-size:12px;color:#7a7264;font-style:italic;margin-bottom:8px;}
.req{color:var(--clay-dark);margin-left:3px;}
input[type=text], input[type=number], input[type=date], input[type=time], textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font-family:'Inter',sans-serif;font-size:14px;background:var(--paper);color:var(--ink);
}
input.mono-input{font-family:'JetBrains Mono',monospace;}
textarea{resize:vertical;min-height:60px;}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--horizon);outline-offset:1px;}

/* pill choice buttons (radio/checkbox) */
.choices{display:flex;flex-wrap:wrap;gap:8px;}
.choice{
  border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:9px 13px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:.15s; user-select:none;
}
.choice:hover{border-color:var(--moss);}
.choice .mark{width:15px;height:15px;border:1.5px solid var(--moss);flex:none;}
.choice.radio .mark{border-radius:50%;}
.choice.checkbox .mark{border-radius:4px;}
.choice.selected{background:var(--canopy);border-color:var(--canopy);color:#fff;}
.choice.selected .mark{background:#fff;border-color:#fff;}
.choice.selected.radio .mark{box-shadow:inset 0 0 0 3px var(--canopy);}
.choice.selected.checkbox .mark::after{content:"✓";color:var(--canopy);font-size:11px;display:block;text-align:center;line-height:13px;font-weight:700;}

/* stage ladder chips (succession stage questions) */
.stagewrap{display:flex;flex-wrap:wrap;gap:8px;}
.stagechip{
  border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;
  max-width:320px;font-size:13px;line-height:1.4;display:flex;gap:9px;align-items:flex-start;
  background:linear-gradient(180deg,#fff,var(--paper));
}
.stagechip .num{
  font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--canopy);
  background:var(--moss-light);border-radius:50%;width:26px;height:26px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.stagechip.selected{border-color:var(--canopy);background:var(--canopy);color:#fff;}
.stagechip.selected .num{background:var(--clay);color:#fff;}

/* compass grid */
.compass{
  display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,52px);
  gap:6px;justify-content:start;margin-bottom:8px;
}
.compass .cbtn{
  border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;
  font-size:11.5px;font-weight:600;color:var(--canopy);display:flex;align-items:center;justify-content:center;
}
.compass .cbtn.selected{background:var(--horizon);border-color:var(--horizon);color:#fff;}
.compass .cbtn.center{background:transparent;border:none;cursor:default;}
.pos-N{grid-column:2;grid-row:1;} .pos-NE{grid-column:3;grid-row:1;}
.pos-W{grid-column:1;grid-row:2;} .pos-C{grid-column:2;grid-row:2;} .pos-E{grid-column:3;grid-row:2;}
.pos-SW{grid-column:1;grid-row:3;} .pos-S{grid-column:2;grid-row:3;} .pos-SE{grid-column:3;grid-row:3;}
.extra-choices{margin-top:8px;}

/* color swatches */
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:78px;text-align:center;cursor:pointer;}
.swatch .chip{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);margin:0 auto 6px;}
.swatch.selected .chip{border-color:var(--canopy);box-shadow:0 0 0 3px var(--moss-light);}
.swatch .lbl{font-size:11px;color:#5b6b5f;}
.swatch.selected .lbl{color:var(--canopy);font-weight:700;}

/* gps group */
.gpsgroup{border:1px dashed var(--horizon);border-radius:9px;padding:14px;background:var(--horizon-light);}
.gpsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.btn{
  border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;
}
.btn-primary{background:var(--clay);color:#fff;}
.btn-primary:hover{background:var(--clay-dark);}
.btn-ghost{background:transparent;border:1.5px solid var(--canopy);color:var(--canopy);}
.btn-ghost:hover{background:var(--canopy);color:#fff;}
.btn-horizon{background:var(--horizon);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.gpsstatus{font-size:12px;margin-top:6px;color:#2c4a52;}

/* photo field */
.photobox{
  border:2px dashed var(--line);border-radius:9px;padding:16px;text-align:center;
  background:var(--paper);cursor:pointer;position:relative;
}
.photobox img{max-width:100%;max-height:220px;border-radius:6px;display:block;margin:0 auto;}
.photobox .hint{font-size:12.5px;color:#8a8272;}
.photobox input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-remove{margin-top:8px;}

/* repeat groups */
.repeat-item{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px;background:var(--paper);position:relative;}
.repeat-item .idx{
  position:absolute;top:-10px;left:12px;background:var(--moss);color:#fff;font-size:11px;font-weight:700;
  padding:2px 9px;border-radius:20px;
}
.repeat-remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--warn);cursor:pointer;font-size:12px;font-weight:600;}
.add-row{border:1.5px dashed var(--moss);border-radius:9px;padding:10px;text-align:center;color:var(--canopy);
  background:var(--moss-light);opacity:.5;cursor:pointer;font-size:13px;font-weight:600;}
.add-row:hover{opacity:.75;}

/* footer nav */
.footer-nav{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:14px 28px;display:flex;justify-content:space-between;align-items:center;
  max-width:900px;margin:0 auto;
}
.footer-nav .step-lbl{font-size:12px;color:#7a7264;}

/* patches list */
.patch-card{
  border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;
  background:#fff;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.patch-card .pname{font-weight:700;font-size:15px;color:var(--canopy);}
.patch-card .pmeta{font-size:12px;color:#7a7264;margin-top:2px;}
.patch-actions{display:flex;gap:8px;}
.progress-ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--moss) calc(var(--pct,0)*1%), var(--sand-2) 0);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--canopy);flex:none;}
.progress-ring span{background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;}

/* tabs inside patch editor */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--sand-2);padding-bottom:0;}
.tab{padding:9px 13px;font-size:12.5px;font-weight:600;color:#7a7264;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--canopy);border-bottom-color:var(--clay);}
.tab.done::after{content:" ✓";color:var(--moss);}

.badge{display:inline-block;background:var(--sand-2);color:var(--canopy);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;}
.intro-block{font-size:13.5px;line-height:1.6;color:#3c473d;border-left:3px solid var(--moss);padding:8px 14px;margin-bottom:14px;background:var(--paper);border-radius:0 6px 6px 0;}
.top-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
@media print{
  .footer-nav,.topbar .ladder,.top-tools{display:none!important;}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;}
}
@media (max-width:520px){
  .content{padding:18px 14px 90px;}
  .topbar{padding:16px 16px 14px;}
  .compass{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,46px);}
  .gpsrow{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===================== DATA MODEL ===================== */
function uid(){ return Math.random().toString(36).slice(2,10); }

function newPatch(){
  return {
    id: uid(),
    patchId:'', gisVerified:'',
    cardinalPoints:[],
    aspect:[], aspectNote:'',
    slope:[], slopeNote:'',
    climaxType:'',
    isSilviculture:'',
    plantedSpecies:[],
    undergrowth:[], nativeVegDominates:'', nativeVegUnderPlanted:'',
    canopyCover:'', canopyDominates:'',
    groundLayer:[], groundVegDominates:'', bushLandDominates:'',
    invasives:[],
    neophyta:[],
    samplingPoint:{lat:'',lon:'',altitude:'',accuracy:''},
    habitatAccess:'',
    hasLargeTrees:'',
    trees:[],
    litterLayer:[],
    topsoilThickness:'', soilHolePhoto:null, topsoilSmell:'',
    subsoilThickness:'', subsoilColor:'', subsoilTexture:'', soilPh:'',
    sightingsDesc:'', sightingsPhoto:null,
    upgradeJustified:'', finalRatingModifier:'', finalRating:'',
    improvementSuggestions:'', groupPhoto:null,
  };
}

const state = {
  step: 0, // 0 intro,1 demographics,2 general,3 patches list,4 patch editor,5 review
  editingPatch: -1,
  patchTab: 'location',
  helpPref:'', mode:'', teamName:'', surveyorName:'',
  affiliations:[], affiliationOther:'', email:'', groupSize:'',
  date:'', time:'', propertyName:'',
  patches: [],
  gpsBusy:false,
};

/* ===================== OPTION SETS ===================== */
const YES_NO_UNSURE=[{v:'yes',l:'Yes'},{v:'no',l:'No'},{v:'unsure',l:'I am not sure. I will need to verify later.'}];
const YES_NO=[{v:'yes',l:'Yes'},{v:'no',l:'No'}];
const YES_NO_UNSURE2=[{v:'yes',l:'Yes'},{v:'no',l:'No'},{v:'unsure',l:'I am not sure'}];
const CARDINALS=[{v:'N',l:'North'},{v:'NE',l:'Northeast'},{v:'E',l:'East'},{v:'SE',l:'Southeast'},{v:'S',l:'South'},{v:'SW',l:'Southwest'},{v:'W',l:'West'},{v:'NW',l:'Northwest'}];
const ASPECT_EXTRA=[{v:'mixed',l:'Mixed (several orientations)'},{v:'flat',l:'(almost) flat'}];
const SLOPE_OPTIONS=[{v:'gentle',l:'Gentle sloping ( < 15°)'},{v:'moderate',l:'Moderate slope (15-25°)'},{v:'steep',l:'Steep sloping ( > 25°)'},{v:'flat',l:'Mostly flat'},{v:'mixture',l:'A mixture (leave a note)'}];
const CLIMAX_OPTIONS=[{v:'91E0_oak',l:'Natura 2000: 91E0 (oak forest)'},{v:'91E0_riparian',l:'Riparian / Swampy Alder woodland - Natura 2000: 91E0'},{v:'2250',l:'Coastal dunes with juniper - Natura 2000: 2250'},{v:'92D0',l:'Oleander scrub (laurel forest) - Natura 2000: 92D0'},{v:'unsure',l:'I am not sure'}];
const PLANTED_SPECIES=[{v:'eucalyptus',l:'Eucalyptus (Eucalyptus globulus)'},{v:'maritime_pine',l:'Maritime pine (Pinus pinaster)'},{v:'stone_pine',l:'Stone pine (Pinus pinea)'},{v:'cork_oak',l:'Cork oak (Quercus suber)'},{v:'strawberry_tree',l:'Strawberry tree (Arbutus unedo)'},{v:'unsure',l:'I am not sure'}];
const GROUND_STAGE0=[{v:'stage0',l:'Stage 0: Mostly bare ground or just dead branches, needles or leaves'},{v:'sparse',l:'Mostly short, knee to hip-high (<50cm) and/or very patchy native vegetation'},{v:'dense',l:'Larger (>50cm) and/or more dense native vegetation'}];
const STAGE123=[{v:'stage1',l:'Stage 1: low growing vegetation; very patchy coverage (<30%)'},{v:'stage2',l:'Stage 2: larger vegetation but very patchy or denser coverage with short vegetation (>30%)'},{v:'stage3',l:'Stage 3: dense coverage with bushes and herbs (often gum cystus >80%)'}];
const STAGE34=[{v:'stage3',l:'Stage 3: mostly gum cistus (Cistus ladanifer), few other species'},{v:'stage4',l:'Stage 4: dense coverage of mostly tree heather (Erica arborea) or tree strawberry (Arbutus unedo) with oak (Quercus spp)'}];
const CANOPY_COVER=[{v:'ge50',l:'≥ 50%'},{v:'lt50',l:'< 50%'}];
const CANOPY_DOMINATES=[{v:'stage5',l:'Stage 5: Maquis scrubland dominated by tall bushes like medronho, tree heather and small oaks'},{v:'stage6',l:'Stage 6: Climax or near climax forest dominated by larger oak trees'}];
const INVASIVES_OPTIONS=[{v:'acacia',l:'Acacia spp.'},{v:'sour_fig',l:'Sour fig (Carpobrotus edulis)'},{v:'maritime_pine',l:'Maritime pine (Pinus pinaster)'},{v:'giant_reed',l:'Giant reed (Arando donax)'},{v:'pampas_grass',l:'Pampas grass (Cortaderia selloana)'},{v:'eucalyptus',l:'Eucalyptus (Eucalyptus globulus)'},{v:'bugle_lily',l:'Bugle lily (Watsonia meriana)'},{v:'others',l:'Others (please take a picture)'},{v:'none',l:'None'}];
const HABITAT_ACCESS=[{v:'easy',l:'Yes, it is easily possible to walk perpendicular from the habitat edge into the vegetation'},{v:'medium',l:'Yes, but with some difficulty'},{v:'impenetrable',l:'No. The undergrowth is impenetrable.'}];
const LITTER_OPTIONS=[{v:'none',l:'No undecomposed material'},{v:'thin',l:'Very thin layer of dry, undecomposed material (<50% ground cover)'},{v:'some',l:'Some litter (more than 50% ground cover)'},{v:'thick',l:'Thick layer of litter and/or small dead branches'},{v:'large',l:'Mostly large branches and dead tree trunks'}];
const TOPSOIL_THICK=[{v:'none',l:'No distinguishable layer'},{v:'lt2',l:'< 2cm'},{v:'2-10',l:'between 2cm and 10cm'},{v:'gt10',l:'> 10cm'}];
const TOPSOIL_SMELL=[{v:'earthy',l:'Earthy (contains a lot of organic materials)'},{v:'foul',l:'Foul (indicates conditions with low oxygen)'},{v:'neutral',l:'Neutral'}];
const SUBSOIL_THICK=[{v:'lt2',l:'< 2cm'},{v:'2-10',l:'2 - 10cm'},{v:'gt10',l:'> 10cm'},{v:'hard',l:'The ground is very hard. It is impossible to dig to the full depth.'}];
const SUBSOIL_COLOR=[{v:'blackish',l:'Blackish',hex:'#3B342A'},{v:'brownish',l:'Brownish',hex:'#7A5230'},{v:'reddish',l:'Reddish',hex:'#A6472C'},{v:'yellowish',l:'Yellowish',hex:'#D9B14C'},{v:'white',l:'White',hex:'#EDE8DC'}];
const SUBSOIL_TEXTURE=[{v:'clay',l:'Smooth (indicates clay)'},{v:'silt',l:'Smooth but grainy (indicates silt)'},{v:'sand',l:'Sandy'}];
const UPGRADE_OPTIONS=[{v:'up',l:'+1 : the vegetation patch is significant enough to justify an upgrade'},{v:'no',l:'No overall upgrade'}];
const RATING_MODIFIER=[{v:'upper',l:'+ (upper end)'},{v:'lower',l:'- (lower end)'},{v:'middle',l:'middle of category'}];
const FINAL_RATING=['0','1-','1','1+','2-','2','2+','3-','3','3+','4-','4','4+','5-','5','5+','6-','6','6+'];
const AFFILIATIONS=['Universidade de Lisboa','CAU Kiel','Leiden University','National University of Ireland (Cork)','Universität Osnabrück','Uniwersytet Przyrodnizcy we Wroclawiu','University of Bologna','Debreceni Egyetem','Waterford Institute of Technology','HNE Eberswalde','Rewilding Sudoeste','Brunel University of London','Others (please use the next text box)','None'];

/* ===================== UTIL ===================== */
function getPath(obj,path){return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function setPath(obj,path,val){const k=path.split('.');let o=obj;for(let i=0;i<k.length-1;i++){o=o[k[i]];}o[k[k.length-1]]=val;}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ===================== FIELD RENDERERS ===================== */
function qLabel(label, required, note){
  return `<label class="q">${esc(label)}${required?'<span class="req">*</span>':''}</label>` + (note?`<div class="note">${esc(note)}</div>`:'');
}

function radioGroup(path,label,options,required,note){
  const val=getPath(state,path)||'';
  return `<div class="field">${qLabel(label,required,note)}
    <div class="choices">
      ${options.map(o=>`<div class="choice radio ${val===o.v?'selected':''}" data-bind-radio="${path}" data-value="${esc(o.v)}"><span class="mark"></span>${esc(o.l)}</div>`).join('')}
    </div></div>`;
}
function checkboxGroup(path,label,options,required,note){
  const arr=getPath(state,path)||[];
  return `<div class="field">${qLabel(label,required,note)}
    <div class="choices">
      ${options.map(o=>`<div class="choice checkbox ${arr.includes(o.v)?'selected':''}" data-bind-checkbox="${path}" data-value="${esc(o.v)}"><span class="mark"></span>${esc(o.l)}</div>`).join('')}
    </div></div>`;
}
function stageRadio(path,label,options,required,note){
  const val=getPath(state,path)||'';
  return `<div class="field">${qLabel(label,required,note)}
    <div class="stagewrap">
      ${options.map(o=>{
        const m=o.l.match(/^Stage\s*([0-9]+)/i);
        const num=m?m[1]:'•';
        return `<div class="stagechip ${val===o.v?'selected':''}" data-bind-radio="${path}" data-value="${esc(o.v)}"><span class="num">${num}</span><span>${esc(o.l)}</span></div>`;
      }).join('')}
    </div></div>`;
}
function stageCheckbox(path,label,options,required,note){
  const arr=getPath(state,path)||[];
  return `<div class="field">${qLabel(label,required,note)}
    <div class="stagewrap">
      ${options.map(o=>{
        const m=o.l.match(/^Stage\s*([0-9]+)/i);
        const num=m?m[1]:'•';
        return `<div class="stagechip ${arr.includes(o.v)?'selected':''}" data-bind-checkbox="${path}" data-value="${esc(o.v)}"><span class="num">${num}</span><span>${esc(o.l)}</span></div>`;
      }).join('')}
    </div></div>`;
}
function textField(path,label,required,note,placeholder){
  const val=getPath(state,path)||'';
  return `<div class="field">${qLabel(label,required,note)}
    <input type="text" data-bind-text="${path}" value="${esc(val)}" placeholder="${esc(placeholder||'')}"></div>`;
}
function textareaField(path,label,required,note,placeholder){
  const val=getPath(state,path)||'';
  return `<div class="field">${qLabel(label,required,note)}

const PATCH_TABS=[
  {key:'location',label:'Ubicación',fn:sectionLocation},
  {key:'vegetation',label:'Vegetación',fn:sectionVegetation},
  {key:'invasives',label:'Invasoras',fn:sectionInvasives},
  {key:'sampling',label:'Muestreo',fn:sectionSampling},
  {key:'trees',label:'Árboles',fn:sectionTrees},
  {key:'soil',label:'Suelo',fn:sectionSoil},
  {key:'close',label:'Cierre',fn:sectionClose},
];

function patchCompleteness(p){
  let total=0, done=0;
  const req=[p.patchId,p.gisVerified,p.aspect.length,p.slope.length,p.isSilviculture,p.canopyCover,
    p.invasives.length,p.samplingPoint.lat,p.habitatAccess,p.hasLargeTrees,p.litterLayer.length,
    p.topsoilThickness,p.soilHolePhoto,p.topsoilSmell,p.subsoilThickness,p.subsoilColor,p.subsoilTexture];
  req.forEach(v=>{total++; if(v && v!=='' ) done++; });
  return Math.round(done/total*100);
}

  </div>`;
}

/* ===================== MAIN RENDER ===================== */
function renderFooter(){
  const labels=['Introducción','Equipo','Información general','Parcelas','Editor de parcela','Resumen'];
  return `<div class="footer-nav">
    <button class="btn btn-ghost btn-sm" data-action="prevstep" type="button">← Atrás</button>
    <span class="step-lbl">${labels[state.step]}</span>
    <button class="btn btn-primary btn-sm" data-action="nextstep" type="button">Siguiente →</button>
  </div>`;
}

function render(){
  let body='';
  if(state.step===0) body=renderIntro();
  else if(state.step===1) body=renderDemographics();
  else if(state.step===2) body=renderGeneral();
  else if(state.step===3) body=renderPatchesList();
  else if(state.step===4) body=renderPatchEditor();
  else if(state.step===5) body=renderReview();
  document.getElementById('root').innerHTML = renderTopbar() + body + renderFooter();
}

/* ===================== ACTIONS ===================== */
function gotoStep(n){ state.step=n; if(n!==4) state.editingPatch=-1; render(); }
function nextStep(){
  if(state.step<5){ state.step++; if(state.step===4 && state.editingPatch<0){ state.step=3; } render(); window.scrollTo(0,0);}
}
function prevStep(){
  if(state.step===4){ state.step=3; } else if(state.step>0){ state.step--; }
  render(); window.scrollTo(0,0);
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action=t.getAttribute('data-action');

  if(action==='gotostep'){ gotoStep(parseInt(t.getAttribute('data-step'))); }
  else if(action==='nextstep'){ nextStep(); }
  else if(action==='prevstep'){ prevStep(); }
  else if(action==='addpatch'){ state.patches.push(newPatch()); state.editingPatch=state.patches.length-1; state.patchTab='location'; state.step=4; render(); }
  else if(action==='editpatch'){ state.editingPatch=parseInt(t.getAttribute('data-index')); state.patchTab='location'; state.step=4; render(); }
  else if(action==='removepatch'){ if(confirm('¿Eliminar esta parcela y todos sus datos?')){ state.patches.splice(parseInt(t.getAttribute('data-index')),1); render(); } }
  else if(action==='backtolist'){ state.step=3; state.editingPatch=-1; render(); }
  else if(action==='patchtab'){ state.patchTab=t.getAttribute('data-tab'); render(); }
  else if(action==='addItem'){
    const path=t.getAttribute('data-path'), kind=t.getAttribute('data-kind');
    const arr=getPath(state,path);
    if(kind==='cardinal') arr.push({cardinal:'',lat:'',lon:'',altitude:'',accuracy:''});
    else if(kind==='neophyta') arr.push({details:'',photo:null});
    else if(kind==='tree') arr.push({number:'',circumference:''});
    render();
  }
  else if(action==='removeItem'){
    const path=t.getAttribute('data-path'), idx=parseInt(t.getAttribute('data-index'));
    getPath(state,path).splice(idx,1); render();
  }
  else if(action==='clearphoto'){ setPath(state,t.getAttribute('data-path'),null); render(); }
  else if(action==='gps'){ doGps(t.getAttribute('data-path')); }
  else if(action==='exportjson'){ exportJSON(); }
  else if(action==='exportcsv'){ exportCSV(); }
  else if(action==='printview'){ window.print(); }
  return;
});

// radio / checkbox choice clicks (not buttons, use click delegation too)
document.addEventListener('click', function(e){
  const r=e.target.closest('[data-bind-radio]');
  if(r){ setPath(state, r.getAttribute('data-bind-radio'), r.getAttribute('data-value')); render(); return; }
  const c=e.target.closest('[data-bind-checkbox]');
  if(c){
    const path=c.getAttribute('data-bind-checkbox'), val=c.getAttribute('data-value');
    const arr=getPath(state,path)||[];
    const idx=arr.indexOf(val);
    if(idx>-1) arr.splice(idx,1); else arr.push(val);
    setPath(state,path,arr);
    render();
    return;
  }
});

// text/number/date/time inputs: update state without full re-render (preserve focus)
document.addEventListener('input', function(e){
  const el=e.target.closest('[data-bind-text]');
  if(el){ setPath(state, el.getAttribute('data-bind-text'), el.value); }
});
document.addEventListener('change', function(e){
  const el=e.target.closest('input[type=date],input[type=time]');
  if(el && el.hasAttribute('data-bind-text')){ setPath(state, el.getAttribute('data-bind-text'), el.value); render(); }
});

// photo inputs
document.addEventListener('change', function(e){
  const el=e.target.closest('[data-bind-photo]');
  if(!el || !el.files || !el.files[0]) return;
  const path=el.getAttribute('data-bind-photo');
  const file=el.files[0];
  const reader=new FileReader();
  reader.onload=function(ev){ setPath(state,path,ev.target.result); render(); };
  reader.readAsDataURL(file);
});

function doGps(basePath){
  const statusEl = ()=>document.getElementById('gpsstatus-'+basePath.replace(/\./g,'-'));
  if(!navigator.geolocation){
    const el=statusEl(); if(el) el.textContent='La geolocalización no está disponible en este navegador/entorno.';
    return;
  }
  state.gpsBusy=true; render();
  navigator.geolocation.getCurrentPosition(function(pos){
    setPath(state,basePath+'.lat', pos.coords.latitude.toFixed(6));
    setPath(state,basePath+'.lon', pos.coords.longitude.toFixed(6));
    setPath(state,basePath+'.altitude', pos.coords.altitude!=null? Math.round(pos.coords.altitude): '');
    setPath(state,basePath+'.accuracy', pos.coords.accuracy!=null? Math.round(pos.coords.accuracy): '');
    state.gpsBusy=false; render();
  }, function(err){
    state.gpsBusy=false; render();
    const el=statusEl(); if(el) el.textContent='No se pudo obtener la ubicación (' + err.message + '). Puedes introducir las coordenadas manualmente.';
  }, {enableHighAccuracy:true, timeout:10000});
}

/* ===================== EXPORT ===================== */
function downloadBlob(filename, content, type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
}
function exportJSON(){
  downloadBlob('gowild-survey-'+(state.date||'sin-fecha')+'.json', JSON.stringify(state,null,2), 'application/json');
}
function exportCSV(){
  const cols=['patchId','gisVerified','aspect','slope','climaxType','isSilviculture','canopyCover','canopyDominates','groundVegDominates','bushLandDominates','invasives','habitatAccess','hasLargeTrees','litterLayer','topsoilThickness','topsoilSmell','subsoilThickness','subsoilColor','subsoilTexture','soilPh','finalRating','improvementSuggestions'];
  const rows=[cols.join(',')];
  state.patches.forEach(p=>{
    rows.push(cols.map(c=>{
      let v=p[c];
      if(Array.isArray(v)) v=v.join('|');
      v = (v==null?'':String(v)).replace(/"/g,'""');
      return '"'+v+'"';
    }).join(','));
  });
  downloadBlob('gowild-parcelas-'+(state.date||'sin-fecha')+'.csv', rows.join(String.fromCharCode(10)), 'text/csv');
}

render();
</script>
