<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AgriTwin 3D - Isotipo Variante 1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    body {
      background-color: #070a11;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: rgba(11, 17, 28, 0.94);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.15);
      max-width: 500px;
    }

    .logo-badge {
      width: 240px;
      height: 240px;
      margin: 0 auto 24px auto;
      background: #0b111c;
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 24px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #06b6d4;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .pill-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
    }

    .pill.topo { color: #10b981; border-color: rgba(16, 185, 129, 0.4); }
    .pill.grid { color: #06b6d4; border-color: rgba(6, 182, 212, 0.4); }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-badge">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
          <radialGradient id="v1GlowLarge" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#070a11" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="v1GradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
          <linearGradient id="meshGradLarge" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>

        <circle cx="100" cy="100" r="90" fill="url(#v1GlowLarge)"/>

        <!-- Leaf Outer Silhouette -->
        <path d="M 100 20 C 148 45, 175 90, 155 142 C 140 174, 105 180, 100 180 C 95 180, 60 174, 45 142 C 25 90, 52 45, 100 20 Z"
              fill="none" stroke="url(#v1GradLarge)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Stem -->
        <path d="M 100 20 L 100 180" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Left: Topographic Elevation Contours (Rewild Connection) -->
        <path d="M 98 40 C 76 50, 58 68, 50 94 C 46 108, 52 124, 66 134 C 78 144, 94 150, 98 162" fill="none" stroke="#10b981" stroke-width="3"/>
        <path d="M 98 62 C 80 74, 68 88, 64 104 C 60 120, 74 132, 98 142" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
        <path d="M 98 84 C 86 92, 78 102, 80 114 C 82 122, 90 126, 98 128" fill="none" stroke="#38bdf8" stroke-width="2"/>

        <!-- Right: 3D Spatial Grid & Telemetry Nodes (AgroTech Chile Connection) -->
        <path d="M 100 45 L 142 62 M 100 70 L 154 90 M 100 95 L 160 116 M 100 120 L 152 140" fill="none" stroke="url(#meshGradLarge)" stroke-width="2.5"/>
        <path d="M 116 35 L 134 162 M 134 58 L 154 136" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>
        
        <!-- Glowing Nodes -->
        <circle cx="142" cy="62" r="5.5" fill="#f59e0b"/>
        <circle cx="154" cy="90" r="5" fill="#06b6d4"/>
        <circle cx="160" cy="116" r="6" fill="#10b981"/>
        <circle cx="122" cy="78" r="4" fill="#ffffff"/>
      </svg>
    </div>

    <div class="title">AgriTwin 3D</div>
    <div class="subtitle">by AgroTech Chile • Isotipo Variante 1</div>
    <div class="desc">
      Fusión híbrida entre las curvas de nivel topográficas de <strong>Rewild</strong> (izquierda) y la malla de elevación espacial 3D de <strong>AgroTech Chile</strong> (derecha).
    </div>

    <div class="pill-group">
      <div class="pill topo">🍃 Curvas Topográficas</div>
      <div class="pill grid">📡 Malla 3D & Nodos IoT</div>
    </div>
  </div>

</body>
</html>
