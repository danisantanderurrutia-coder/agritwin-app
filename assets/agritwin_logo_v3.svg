<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="v3Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070a11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v3Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#v3Glow)"/>

  <!-- Leaf Contour -->
  <path d="M 100 20 C 146 46, 174 90, 154 142 C 138 174, 105 180, 100 180 C 95 180, 62 174, 46 142 C 26 90, 54 46, 100 20 Z"
        fill="none" stroke="url(#v3Grad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Stem -->
  <path d="M 100 20 C 98 70, 102 120, 100 180" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>

  <!-- Spatial Voronoi Polygon Mesh Cells (Data Canopy) -->
  <!-- Left Cells -->
  <polygon points="100,42 70,60 100,82" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.6"/>
  <polygon points="70,60 48,94 76,108 100,82" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.6"/>
  <polygon points="76,108 58,136 84,152 100,126 100,82" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="1.6"/>

  <!-- Right Cells -->
  <polygon points="100,42 130,60 100,82" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.6"/>
  <polygon points="130,60 152,94 124,108 100,82" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.6"/>
  <polygon points="124,108 142,136 116,152 100,126 100,82" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" stroke-width="1.6"/>

  <!-- Active Nodes / Sensors at Vertices -->
  <circle cx="70" cy="60" r="4" fill="#06b6d4"/>
  <circle cx="130" cy="60" r="4" fill="#10b981"/>
  <circle cx="48" cy="94" r="3.5" fill="#eab308"/>
  <circle cx="152" cy="94" r="3.5" fill="#06b6d4"/>
  <circle cx="76" cy="108" r="4.5" fill="#ffffff"/>
  <circle cx="124" cy="108" r="4.5" fill="#ffffff"/>
  <circle cx="84" cy="152" r="3.5" fill="#10b981"/>
  <circle cx="116" cy="152" r="3.5" fill="#eab308"/>
</svg>
