<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="nanoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Nanobanana Gold Gradient -->
    <linearGradient id="bananaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Cyber Cyan-Emerald Gradient -->
    <linearGradient id="cyberMeshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#nanoGlow)"/>

  <!-- Outer Tech Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="14 10" opacity="0.3"/>

  <!-- Organic Digital Leaf Contour -->
  <path d="M 100 18 C 148 44, 176 88, 158 142 C 142 174, 106 182, 100 182 C 94 182, 58 174, 42 142 C 24 88, 52 44, 100 18 Z"
        fill="none" stroke="url(#cyberMeshGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>

  <!-- Dynamic Nanobanana Arc (Curva Nanobanana caracteristica) -->
  <path d="M 54 135 C 40 90, 68 38, 100 24 C 115 50, 118 92, 98 176" 
        fill="none" stroke="url(#bananaGoldGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glowGold)"/>

  <!-- Topographic Elevation Contours (Rewild Legacy) -->
  <path d="M 98 42 C 78 52, 60 70, 52 95 C 48 108, 54 125, 68 135 C 80 144, 94 150, 98 162" 
        fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.95" filter="url(#glowCyan)"/>
  <path d="M 98 64 C 84 74, 74 88, 70 104 C 66 118, 78 128, 98 138" 
        fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.85"/>

  <!-- 3D Spatial Grid & Cyber Mesh (AgroTech Chile) -->
  <path d="M 100 45 L 142 60 M 100 68 L 154 86 M 100 92 L 160 112 M 100 118 L 152 138 M 100 145 L 134 160" 
        fill="none" stroke="url(#cyberMeshGrad)" stroke-width="2" opacity="0.9" filter="url(#glowCyan)"/>
  <path d="M 116 35 L 134 160 M 134 57 L 154 135 M 148 84 L 160 112" 
        fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.65"/>

  <!-- Nanobanana Energy Vertices (Nodos IoT Ligeros) -->
  <circle cx="142" cy="60" r="5" fill="#facc15" filter="url(#glowGold)"/>
  <circle cx="154" cy="86" r="4" fill="#06b6d4" filter="url(#glowCyan)"/>
  <circle cx="160" cy="112" r="5" fill="#10b981" filter="url(#glowCyan)"/>
  <circle cx="152" cy="138" r="4" fill="#facc15" filter="url(#glowGold)"/>
  <circle cx="120" cy="75" r="3.5" fill="#ffffff" filter="url(#glowGold)"/>

  <!-- Inter-Node Pulsing Data Link -->
  <line x1="142" y1="60" x2="120" y2="75" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.9"/>
  <line x1="120" y1="75" x2="154" y2="86" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.85"/>
</svg>
